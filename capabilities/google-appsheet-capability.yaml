naftiko: 1.0.0-alpha2
info:
  label: Google AppSheet API
  description: The Google AppSheet API enables programmatic access to AppSheet applications, allowing developers to add, update,
    delete, and find records in AppSheet tables, as well as invoke predefined AppSheet actions via a REST interface.
  tags:
  - Google
  - Appsheet
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-appsheet
    baseUri: https://api.appsheet.com/api/v2
    description: Google AppSheet API HTTP API.
    authentication:
      type: apikey
      in: header
      name: ApplicationAccessKey
      value: '{{GOOGLE_APPSHEET_TOKEN}}'
    resources:
    - name: apps-appid-tables-tablename-action
      path: /apps/{appId}/tables/{tableName}/Action
      operations:
      - name: invokeaction
        method: POST
        description: Google AppSheet Invoke Table Action
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
          description: The unique identifier of the AppSheet application.
        - name: tableName
          in: path
          type: string
          required: true
          description: The name of the table to perform the action on.
        - name: applicationAccessKey
          in: query
          type: string
          description: The application access key for authentication.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: google-appsheet-rest
    description: REST adapter for Google AppSheet API.
    resources:
    - path: /apps/{appId}/tables/{tableName}/Action
      name: invokeaction
      operations:
      - method: POST
        name: invokeaction
        description: Google AppSheet Invoke Table Action
        call: google-appsheet.invokeaction
        with:
          appId: rest.appId
          tableName: rest.tableName
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: google-appsheet-mcp
    transport: http
    description: MCP adapter for Google AppSheet API for AI agent use.
    tools:
    - name: invokeaction
      description: Google AppSheet Invoke Table Action
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: google-appsheet.invokeaction
      with:
        appId: tools.appId
        tableName: tools.tableName
        applicationAccessKey: tools.applicationAccessKey
      inputParameters:
      - name: appId
        type: string
        description: The unique identifier of the AppSheet application.
        required: true
      - name: tableName
        type: string
        description: The name of the table to perform the action on.
        required: true
      - name: applicationAccessKey
        type: string
        description: The application access key for authentication.
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    GOOGLE_APPSHEET_TOKEN: GOOGLE_APPSHEET_TOKEN
